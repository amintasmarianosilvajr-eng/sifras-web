<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFA SNIPER | ACESSO MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #020408; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .glow { box-shadow: 0 0 50px rgba(0, 245, 255, 0.2); }
    </style>
</head>
<body>
    <div class="w-full max-w-[420px] bg-[#0d1117]/80 backdrop-blur-2xl border border-white/10 rounded-[40px] p-10 glow mx-4">
        <div class="text-center mb-10">
            <img src="https://static.wixstatic.com/media/067451_2a61f3647f154379965158671404c0cb~mv2.png" class="h-20 mx-auto drop-shadow-[0_0_15px_#00F5FF]">
            <h1 class="text-3xl font-black mt-4 tracking-tighter text-white">PROTOCOLO <span class="text-[#00F5FF]">FERRARI</span></h1>
        </div>

        <div id="login-form" class="space-y-6">
            <div class="space-y-4">
                <label class="text-[10px] text-zinc-500 font-bold uppercase tracking-[0.2em] block text-center">Criptografia de Acesso Master</label>
                <input type="password" id="master-pass" placeholder="••••••••" 
                    class="w-full bg-black/40 border border-white/5 rounded-2xl px-6 py-5 text-white placeholder-zinc-800 outline-none focus:border-[#00F5FF]/40 focus:bg-black/60 transition-all text-center text-3xl tracking-[0.4em] font-black">
                
                <button id="btn-submit" onclick="handleLogin()" 
                    class="w-full bg-[#00F5FF] text-black font-black uppercase py-5 rounded-2xl tracking-[0.2em] shadow-[0_0_30px_rgba(0,245,255,0.3)] hover:scale-[1.02] active:scale-95 transition-all">
                    LIBERAR ACESSO
                </button>
            </div>
            <p class="text-center text-[9px] text-zinc-600 font-bold uppercase tracking-widest mt-8">SNIPER ELITE v3.5 - MASTER READY</p>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const pass = document.getElementById('master-pass').value;
            if(!pass) return alert("DIGITE A SENHA");

            const btn = document.getElementById('btn-submit');
            btn.textContent = "VALIDANDO...";
            btn.disabled = true;

            try {
                const r = await fetch('/login-master', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                if (r.ok) {
                    localStorage.setItem('alfa_auth', 'MASTER');
                    localStorage.setItem('alfa_pending_name', 'OPERADOR MASTER');
                    window.location.href = '/operacional';
                } else {
                    alert("🛑 SENHA INCORRETA");
                }
            } catch (e) {
                alert("FALHA NA CONEXÃO");
            } finally {
                btn.textContent = "LIBERAR ACESSO";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
