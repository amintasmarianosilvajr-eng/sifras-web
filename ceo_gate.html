<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras — Acesso Reservado (CEO)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --cyber-blue: #00f2ff;
            --alert-red: #ff3366;
            --text-main: #ffffff;
            --glass-panel: rgba(18, 18, 18, 0.98);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: radial-gradient(circle at 50% 10%, rgba(0, 242, 255, 0.05) 0%, transparent 80%), #111111;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .gate-card { width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; background: var(--glass-panel); border: 1px solid rgba(0, 242, 255, 0.1); box-shadow: 0 0 60px rgba(0,0,0,0.8); text-align: center; }
        .logo-box h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 2px; color: var(--cyber-blue); margin-bottom: 30px; }
        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; margin-bottom: 10px; font-size: 0.8rem; color: #777; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-family: 'Outfit'; font-size: 1.1rem; text-align: center; letter-spacing: 4px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: var(--cyber-blue); box-shadow: 0 0 15px rgba(0,242,255,0.2); }
        .btn-ceo { width: 100%; padding: 18px; background: rgba(0,242,255,0.1); border: 1px solid var(--cyber-blue); color: var(--cyber-blue); border-radius: 12px; font-family: 'Orbitron'; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-ceo:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 30px rgba(0,242,255,0.4); }
        .error-msg { display: none; margin-top: 20px; font-size: 0.9rem; color: var(--alert-red); }
        .back-link { display: block; margin-top: 30px; font-size: 0.8rem; color: #444; text-decoration: none; transition: 0.3s; }
        .back-link:hover { color: #888; }
    </style>
</head>
<body>
    <div class="gate-card">
        <div class="logo-box">
            <h1>FINANCE <span style="color: #fff;">TECH</span><br><span style="font-size: 0.55rem; color: #555; letter-spacing: 4px;">INTELIGÊNCIA FINANCEIRA</span></h1>
        </div>
        <div class="input-group">
            <label>CHAVE MESTRA CEO (3ª ETAPA)</label>
            <input type="password" id="ceoKey" placeholder="••••••••" autofocus>
        </div>
        <button class="btn-ceo" onclick="validateCEO()">DESBLOQUEAR ACESSO CEO</button>
        <div class="error-msg" id="errorMsg">Chave inválida. Acesso reservado.</div>
        <a href="/login.html" class="back-link">VOLTAR AO LOGIN GLOBAL</a>
    </div>

    <script>
        document.getElementById('ceoKey').addEventListener('keypress', (e) => { if(e.key === 'Enter') validateCEO(); });
        
        async function validateCEO() {
            const key = document.getElementById('ceoKey').value;
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            if (key === 'sifras_ceo_2026@') {
                sessionStorage.setItem('ceoOk', 'true');
                window.location.href = '/finance_tech.html';
            } else {
                err.style.display = 'block';
                document.getElementById('ceoKey').value = '';
            }
        }
    </script>
</body>
</html>
