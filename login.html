<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa — Acesso Direto</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --cyber-blue: #ccff00;
            --text-main: #ffffff;
            --glass: rgba(20, 20, 20, 0.98);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--glass);
            border: 1px solid rgba(204, 255, 0, 0.15);
            padding: 45px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .logo-box span { color: var(--cyber-blue); }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--cyber-blue); }

        .btn-auth {
            width: 100%;
            background: var(--cyber-blue);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        #errorMsg {
            margin-top: 20px;
            color: #ff3366;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">
        <h1>SIFRAS <span>ALFA</span></h1>
    </div>

    <div class="input-group">
        <label>E-mail ou Chave de Acesso</label>
        <input type="text" id="email" placeholder="Gmail ou Chave VIP...">
    </div>

    <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="...">
    </div>

    <button class="btn-auth" onclick="doAuth()">ENTRAR NO SISTEMA</button>

    <div id="errorMsg"></div>
</div>

<script>
    async function doAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const err = document.getElementById('errorMsg');
        err.style.display = 'none';

        if (!email && !password) return;

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('sifras_token', data.token);
                localStorage.setItem('sifras_user', data.username);
                window.location.href = data.isAdmin ? 'admin.html' : 'dashboard.html';
            } else {
                err.innerText = data.error;
                err.style.display = 'block';
            }
        } catch (e) {
            err.innerText = 'Erro ao conectar.';
            err.style.display = 'block';
        }
    }
</script>

</body>
</html>
