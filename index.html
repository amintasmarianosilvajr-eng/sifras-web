<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa - Gateway de Acesso</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05080c;
            --accent-cyan: #00f5ff;
            --accent-ruby: #ff2a6d;
            --glass-bg: rgba(10, 15, 25, 0.85);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 245, 255, 0.06) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .custom-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            height: 54px;
            padding: 0 20px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            letter-spacing: 0.5em;
        }

        .custom-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent-cyan);
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 245, 255, 0.15);
        }

        .btn-premium {
            width: 100%;
            height: 54px;
            background: var(--accent-cyan);
            color: #000;
            border-radius: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 245, 255, 0.5);
        }

        .btn-premium:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 42, 109, 0.1);
            border: 1px solid rgba(255, 42, 109, 0.2);
            border-radius: 12px;
            color: var(--accent-ruby);
            font-size: 0.8rem;
            text-align: center;
            font-weight: 600;
        }

        .error-msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }

        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0; right: 0; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent-cyan), transparent);
            opacity: 0.1;
            animation: scan 3s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="scan-line"></div>

    <div class="glass-panel text-center">
        <div class="mb-8 relative inline-block">
            <div class="absolute inset-0 bg-accent-cyan/20 blur-2xl rounded-full"></div>
            <img src="logo.png" alt="Logo" class="relative z-10 w-24 h-24 mx-auto rounded-3xl shadow-xl">
        </div>

        <h1 class="text-2xl font-black italic uppercase italic tracking-tighter mb-1">
            Sifras <span class="text-accent-cyan">Alfa</span>
        </h1>
        <p class="text-[0.6rem] text-slate-500 font-bold tracking-[0.4em] uppercase mb-10">Gateway de Segurança</p>

        <div class="space-y-6">
            <div class="space-y-2 text-left">
                <label class="text-[0.65rem] text-slate-500 font-black uppercase tracking-widest ml-1">Chave de Acesso Sniper</label>
                <input type="password" id="inputGateway" placeholder="••••••••" autofocus class="custom-input">
            </div>

            <button id="btnGateway" onclick="checkGateway()" class="btn-premium">
                <i data-lucide="shield-check" class="w-5 h-5"></i> Validar Acesso
            </button>
        </div>

        <div id="errorGateway" class="error-msg">
            <i data-lucide="alert-circle" class="w-4 h-4"></i> Chave de acesso inválida
        </div>

        <div class="mt-12 pt-8 border-t border-white/5 space-y-2">
            <p class="text-[0.6rem] text-slate-600 font-bold uppercase tracking-wider">Sifras Invest Financeiro LTDA</p>
            <p class="text-[0.55rem] text-slate-700 font-bold mono">CNPJ: 63.326.067/0001-30</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('inputGateway').addEventListener('keydown', (e) => { 
            if (e.key === 'Enter') checkGateway(); 
        });

        async function checkGateway() {
            const accessKey = document.getElementById('inputGateway').value;
            const btn = document.getElementById('btnGateway');
            const errorMsg = document.getElementById('errorGateway');
            if (!accessKey) return;

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Verificando...`;
            errorMsg.classList.remove('show');
            lucide.createIcons();

            try {
                const res = await fetch('/gateway', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accessKey })
                });
                if (res.ok) {
                    sessionStorage.setItem('gatewayOk', 'true');
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.innerHTML = '<i data-lucide="wifi-off" class="w-4 h-4"></i> Falha na conexão com o servidor';
                errorMsg.classList.add('show');
                lucide.createIcons();
            }
            btn.disabled = false;
            btn.innerHTML = `<i data-lucide="shield-check" class="w-5 h-5"></i> Validar Acesso`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
