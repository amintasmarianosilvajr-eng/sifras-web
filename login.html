<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa — Acesso Restrito</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --cyber-blue: #ccff00;
            --alert-red: #ff3366;
            --text-main: #ffffff;
            --glass-panel: rgba(18, 18, 18, 0.97);
            --border-glow: rgba(204, 255, 0, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 0%, rgba(204, 255, 0, 0.07) 0%, transparent 70%), #111111;
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-box { text-align: center; margin-bottom: 40px; }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; }
        .logo-alfa { color: var(--cyber-blue); text-shadow: 0 0 20px rgba(204, 255, 0, 0.5); }
        .logo-sub { color: #555; font-size: 0.8rem; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase; }
        .panel {
            background: var(--glass-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 30px rgba(204,255,0,0.03);
        }
        .panel-title { font-family: 'Orbitron', sans-serif; font-size: 1rem; color: var(--cyber-blue); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #a0aab5; font-size: 0.85rem; }
        .input-group input {
            width: 100%; padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; color: #fff;
            font-family: 'Outfit', sans-serif; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--cyber-blue); box-shadow: 0 0 12px var(--border-glow); }
        .btn-login {
            width: 100%; padding: 15px;
            background: rgba(204, 255, 0, 0.1);
            color: var(--cyber-blue);
            border: 1px solid var(--cyber-blue);
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-top: 5px;
        }
        .btn-login:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 25px var(--border-glow); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            display: none;
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.4);
            color: var(--alert-red);
            padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-top: 15px; text-align: center;
        }
        .error-msg.show { display: block; }
        .footer-note { text-align: center; color: #333; font-size: 0.75rem; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="logo-box">
            <div class="logo-text">SIFRAS <span class="logo-alfa">ALFA</span></div>
            <div class="logo-sub">Acesso do Cliente</div>
        </div>

        <div class="panel">
            <div id="stepEmail">
                <div class="panel-title"><i class="ph ph-user"></i> Acesso Individual</div>
                <div class="input-group">
                    <label>E-mail (Apenas @gmail.com)</label>
                    <input type="email" id="inputEmail" placeholder="seu.nome@gmail.com" autofocus>
                </div>
                <button class="btn-login" id="btnSendOtp" onclick="requestOtp()">
                    <i class="ph ph-paper-plane-tilt"></i> ENVIAR CÓDIGO
                </button>
            </div>

            <div id="stepOtp" style="display: none;">
                <div class="panel-title"><i class="ph ph-shield-check"></i> Verificação</div>
                <div class="input-group">
                    <label>Código de 6 dígitos enviado ao e-mail</label>
                    <input type="text" id="inputOtp" placeholder="000000" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 10px;">
                </div>
                <button class="btn-login" id="btnLogin" onclick="doLogin()">
                    <i class="ph-fill ph-sign-in"></i> VERIFICAR E ENTRAR
                </button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="javascript:void(0)" onclick="resetFlow()" style="color: #666; font-size: 0.8rem; text-decoration: none;">&larr; Alterar E-mail</a>
                </div>
            </div>

            <div class="error-msg" id="errorLogin">
                <i class="ph ph-warning"></i> Credenciais incorretas ou erro no acesso.
            </div>
            
            <div id="devInfo" style="display:none; margin-top:15px; padding:10px; background:rgba(204,255,0,0.1); border:1px dashed var(--cyber-blue); color:var(--cyber-blue); font-size:0.8rem; border-radius:8px;"></div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" style="color: #444; font-size: 0.8rem; text-decoration: none;">Monitoramento Sifras Invest &copy; 2025</a>
            </div>
        </div>

        <div class="footer-note">Segurança Alfa: Seu perfil é vinculado ao seu Google ID.</div>
    </div>
    <script>
        const API_URL = '';

        function resetFlow() {
            document.getElementById('stepEmail').style.display = 'block';
            document.getElementById('stepOtp').style.display = 'none';
            document.getElementById('inputOtp').value = '';
            document.getElementById('errorLogin').classList.remove('show');
            document.getElementById('devInfo').style.display = 'none';
        }

        async function requestOtp() {
            const email = document.getElementById('inputEmail').value.trim().toLowerCase();
            const btn = document.getElementById('btnSendOtp');
            const errorMsg = document.getElementById('errorLogin');
            const devInfo = document.getElementById('devInfo');

            if (!email.endsWith('@gmail.com')) {
                errorMsg.innerHTML = '<i class="ph ph-warning"></i> Por favor, use um e-mail @gmail.com válido.';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-circle-notch spin"></i> Enviando...';
            errorMsg.classList.remove('show');

            try {
                const res = await fetch(`${API_URL}/request-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('stepEmail').style.display = 'none';
                    document.getElementById('stepOtp').style.display = 'block';
                    document.getElementById('inputOtp').focus();
                    
                    if (data.devMode) {
                        devInfo.innerHTML = `<strong>MODO DESENVOLVEDOR:</strong><br>${data.localMsg}`;
                        devInfo.style.display = 'block';
                    }
                } else {
                    errorMsg.innerHTML = `<i class="ph ph-warning"></i> ${data.error || 'Erro ao enviar e-mail.'}`;
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.innerHTML = 'Erro de conexão com o servidor local.';
                errorMsg.classList.add('show');
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> ENVIAR CÓDIGO';
        }

        async function doLogin() {
            const email = document.getElementById('inputEmail').value.trim().toLowerCase();
            const otp = document.getElementById('inputOtp').value.trim();
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorLogin');

            if (!otp || otp.length < 6) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-circle-notch spin"></i> Verificando...';
            errorMsg.classList.remove('show');

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('sifrasToken', data.token);
                    localStorage.setItem('sifrasUser', data.username);
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerHTML = `<i class="ph ph-warning"></i> ${data.error || 'Código incorreto.'}`;
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.innerHTML = 'Erro de conexão com o servidor.';
                errorMsg.classList.add('show');
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="ph-fill ph-sign-in"></i> VERIFICAR E ENTRAR';
        }

        // Enter support
        document.getElementById('inputEmail').addEventListener('keypress', (e) => { if(e.key === 'Enter') requestOtp(); });
        document.getElementById('inputOtp').addEventListener('keypress', (e) => { if(e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
