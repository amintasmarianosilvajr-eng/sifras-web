<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa | Portal de Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-neon: #90C23A;
            --accent-green: #90C23A;
            --danger-neon: #f85149;
            --bg-deep: #060B19;
            --bg-card: #0D1117;
            --text-main: #f0f3f5;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, rgba(144, 194, 58, 0.05) 0%, transparent 70%);
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid rgba(144, 194, 58, 0.2);
            padding: 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo { width: 80px; margin-bottom: 1.5rem; }
        h2 { font-family: 'Outfit'; font-size: 2.2rem; color: #fff; margin-bottom: 0.5rem; letter-spacing: -1.5px; }
        p { font-size: 0.8rem; color: #8b949e; margin-bottom: 2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { font-size: 0.65rem; font-weight: 800; color: var(--primary-neon); text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 1px; }
        input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 18px;
            border-radius: 12px;
            color: #ffffff !important;
            font-family: inherit;
            font-weight: 700;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary-neon); outline: none; background: rgba(0,0,0,0.5); }

        .btn-login {
            width: 100%;
            background: var(--primary-neon);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(144, 194, 58, 0.4);
            border-bottom: 4px solid rgba(0,0,0,0.3);
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(144, 194, 58, 0.5); }
        .btn-login:active { transform: translateY(2px); border-bottom-width: 0; }

        .register-link { margin-top: 2rem; font-size: 0.8rem; color: #8b949e; }
        .register-link a { color: var(--primary-neon); text-decoration: none; font-weight: 700; }

        .error-msg { color: var(--danger-neon); font-size: 0.8rem; font-weight: 700; margin-top: 1rem; display: none; padding: 10px; background: rgba(248, 81, 73, 0.1); border-radius: 8px; border: 1px solid rgba(248, 81, 73, 0.2); }
    </style>
</head>
<body>

    <div class="auth-card">
        <img src="logo.png" alt="Sifras" class="logo">
        <h2 style="font-weight: 900;">ACCESSO ALFA</h2>
        <p>Dashboard de Operações</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="username" placeholder="Seu usuário" required>
            </div>
            <div class="form-group">
                <label>Senha Securitária</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-login">AUTORIZAR ACESSO</button>
            <div id="errorBox" class="error-msg"></div>
        </form>

        <div class="register-link">
            Não tem cadastro? <a href="cadastro.html">Solicitar Acesso</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('errorBox');
            err.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                
                if (result.success) {
                    // Store Session
                    localStorage.setItem('alfa_session_user', result.user.username);
                    if (result.user.keys) {
                         localStorage.setItem('alfa_slot_1', JSON.stringify({
                             name: result.user.username,
                             key: result.user.keys.key,
                             secret: result.user.keys.secret
                         }));
                    }
                    window.location.href = "/operacional";
                } else {
                    err.innerText = result.error || result.msg || "Usuário ou Senha incorretos";
                    err.style.display = 'block';
                }
            } catch (e) {
                err.innerText = "Falha técnica na autorização.";
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
