<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa - Operacional Sniper PRO</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060a10;
            --cyber-blue: #00ffc8;
            --cyber-gold: #00b4ff;
            --alert-red: #ff3366;
            --cyber-green: #39FF14;
            --text-main: #e8f0ff;
            --glass-panel: rgba(10, 15, 25, 0.95);
            --border-glow: rgba(0, 255, 200, 0.2);
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Oxanium', sans-serif;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 200, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 180, 255, 0.05) 0%, transparent 40%),
                #060a10;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .mono { font-family: 'Share Tech Mono', monospace; }

        .glass-card {
            background: var(--glass-panel);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .status-pulse {
            width: 10px; height: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }
        .pulse-active { background: var(--cyber-green); box-shadow: 0 0 15px var(--cyber-green); animation: pulse 1s infinite; }
        .pulse-inactive { background: #666; box-shadow: 0 0 5px #333; }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .rank-card {
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        .rank-card:hover { transform: translateY(-3px); border-color: var(--cyber-blue); }
        .rank-card.trigger-enabled { border-color: var(--cyber-blue); background: rgba(0, 255, 200, 0.05); }
        
        .trigger-indicator {
            position: absolute; top: 0; right: 0;
            padding: 2px 6px; font-size: 0.55rem; font-weight: bold;
            background: var(--cyber-blue); color: #000;
            border-bottom-left-radius: 6px;
            text-transform: uppercase;
        }

        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: var(--cyber-blue); opacity: 0.3; border-radius: 2px; }

        .btn-action {
            height: 42px;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8rem;
        }
        .btn-start { background: var(--cyber-blue); color: #000; box-shadow: 0 0 15px rgba(0, 255, 200, 0.2); }
        .btn-stop { background: rgba(255, 51, 102, 0.1); border: 1px solid var(--alert-red); color: var(--alert-red); }
        .btn-start:hover { box-shadow: 0 0 25px rgba(0, 255, 200, 0.4); }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: var(--cyber-blue); background: rgba(255, 255, 255, 0.1); }

        .active-trade-card {
            background: rgba(0, 255, 200, 0.05);
            border: 1px solid rgba(0, 255, 200, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8">

    <div class="max-w-[1600px] mx-auto space-y-6">
        
        <!-- API Control Center (Top Bar) -->
        <div class="glass-card p-4 flex items-center justify-between gap-6">
            <div class="flex items-center gap-3 shrink-0">
                <div class="bg-[#00ffc8]/10 p-2 rounded-lg">
                    <i data-lucide="shield" class="text-[#00ffc8] w-6 h-6"></i>
                </div>
                <div class="hidden sm:block">
                    <h1 class="text-sm font-bold tracking-tight">Sifras <span class="text-[#00ffc8]">PRO Sniper</span></h1>
                    <p class="text-[0.55rem] text-gray-500 uppercase font-bold mono">Spot Binance 0.4% Target</p>
                </div>
            </div>

            <div class="flex-1 flex gap-4">
                <input type="password" id="inputApiKey" placeholder="DIGITE SUA BINANCE API KEY" class="flex-1 mono border-white/5 bg-white/5 text-[0.7rem] h-[42px] px-4 rounded-lg outline-none focus:border-[#00ffc8]/50">
                <input type="password" id="inputApiSecret" placeholder="DIGITE SEU BINANCE API SECRET" class="flex-1 mono border-white/5 bg-white/5 text-[0.7rem] h-[42px] px-4 rounded-lg outline-none focus:border-[#00ffc8]/50">
            </div>

            <div class="flex items-center gap-3 shrink-0">
                <button id="btnValidate" onclick="validateAPI()" class="h-[42px] px-6 rounded-lg bg-white/5 border border-white/10 text-xs font-bold uppercase tracking-wider hover:bg-white/10 transition-all flex items-center gap-2">
                    <i data-lucide="link" class="w-4 h-4"></i> Validar Acesso
                </button>

                <button id="btnStart" onclick="toggleMotor(true)" class="h-[42px] px-8 rounded-lg bg-orange-500 text-black text-[0.7rem] font-black uppercase tracking-widest hover:brightness-110 transition-all flex items-center gap-2 opacity-50 pointer-events-none">
                    <i data-lucide="zap" class="w-4 h-4"></i> ATIVAR GATILHO
                </button>
                <button id="btnStop" onclick="toggleMotor(false)" class="h-[42px] px-8 rounded-lg bg-red-500/10 border border-red-500 text-red-500 text-[0.7rem] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all flex items-center gap-2" style="display:none;">
                    <i data-lucide="power" class="w-4 h-4"></i> DESATIVAR
                </button>
            </div>
        </div>


        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            
            <!-- RANKING SPOT BINANCE -->
            <div class="xl:col-span-3 space-y-4">
                <div class="glass-card p-6 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <span id="statusPulse" class="status-pulse pulse-inactive"></span>
                            <h2 class="text-sm font-bold mono uppercase tracking-wider">Spot Ranking Elite 10 (0.15% / 15s)</h2>
                        </div>
                        <div class="flex items-center gap-4 text-[0.6rem] mono text-gray-500 font-bold uppercase">
                            <span>Vol > 1M USDT</span>
                            <span>Target: 0.4%</span>
                            <span id="updateTimer">Sinc: 1s</span>
                        </div>
                    </div>

                    <div id="rankingGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-5 gap-4">
                        <!-- Rankings 1-50 injected here -->
                        <div class="col-span-full h-64 flex items-center justify-center opacity-20">
                            <p class="mono text-2xl">Aguardando WebSocket...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDEBAR (ACTIVE & LOGS) -->
            <div class="space-y-6">
                
                <!-- POSITIONS -->
                <div class="glass-card p-6 flex flex-col max-h-[400px]">
                    <h2 class="text-sm font-bold mono mb-4 uppercase flex items-center gap-2 text-[#39FF14]">
                        <i data-lucide="circle-dot" class="w-4 h-4"></i> Posições Sniper (<span id="activeCount">0</span>/10)
                    </h2>
                    <div id="activeTradesList" class="flex-1 overflow-y-auto space-y-2 pr-2 log-container">
                        <p class="text-gray-600 text-center text-[0.7rem] py-8 italic uppercase">Nenhum alvo em radar</p>
                    </div>
                </div>

                <!-- AUDIT LOG -->
                <div class="glass-card p-6 flex flex-col h-[400px]">
                    <h2 class="text-sm font-bold mono mb-4 uppercase flex items-center gap-2 text-gray-400">
                        <i data-lucide="activity" class="w-4 h-4"></i> Auditoria Real (Spot Ranking)
                    </h2>
                    <div id="logConsole" class="flex-1 overflow-y-auto space-y-1 text-[0.65rem] mono p-3 bg-black/40 rounded-lg log-container border border-white/5">
                        <p class="text-gray-700">Iniciando sistema operacional...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        const targetRanks = [2, 4, 6, 8, 10];
        
        window.onload = () => {
            const k = localStorage.getItem('alfa_k');
            const s = localStorage.getItem('alfa_s');
            const n = localStorage.getItem('alfa_n');
            if(k) document.getElementById('inputApiKey').value = k;
            if(s) document.getElementById('inputApiSecret').value = s;
            if(n) document.getElementById('inputClientName').value = n;
            
            setInterval(updateData, 1000);
        };

        async function updateData() {
            try {
                const res = await fetch('/status');
                if(!res.ok) return;
                const data = await res.json();
                updateUI(data);
            } catch(e) {}
        }

        function updateUI(data) {
            const pulse = document.getElementById('statusPulse');
            const btnS = document.getElementById('btnStart');
            const btnT = document.getElementById('btnStop');

            if (data.isLoopActive) {
                pulse.className = 'status-pulse pulse-active';
                btnS.style.display = 'none';
                btnT.style.display = 'flex';
            } else {
                pulse.className = 'status-pulse pulse-inactive';
                btnS.style.display = 'flex';
                btnT.style.display = 'none';
            }            // Ranking: APENAS 10 SLOTS (Sincronia Elite Spot)
            const grid = document.getElementById('rankingGrid');
            const top = data.top10 || [];
            if (top.length > 0) {
                grid.innerHTML = top.slice(0, 10).map((coin, index) => {
                    const rank = index + 1;
                    const isTarget = targetRanks.includes(rank);
                    return `
                        <div class="rank-card glass-card p-6 flex flex-col gap-2 ${isTarget ? 'trigger-enabled ring-1 ring-[#00ffc8]/30 shadow-[0_0_20px_rgba(0,255,200,0.1)]' : ''}">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-2">
                                    <span class="mono text-2xl font-black ${rank <= 3 ? 'text-[#00ffc8]' : 'text-gray-600'}">#${rank}</span>
                                    ${isTarget ? '<span class="text-[0.55rem] bg-[#00ffc8]/20 text-[#00ffc8] px-2 py-1 rounded font-bold uppercase tracking-widest">Sniper</span>' : ''}
                                </div>
                                <span class="font-bold text-white text-lg tracking-tighter">${coin.symbol.replace('USDT', '/USDT')}</span>
                            </div>
                            <div class="flex justify-between items-end mt-2">
                                <div class="flex flex-col">
                                    <span class="mono text-sm text-gray-400 font-bold">$${parseFloat(coin.price).toFixed(coin.price < 1 ? 6 : 4)}</span>
                                    <span class="text-[0.6rem] opacity-30 mono">VOL: $${(coin.volume/1000000).toFixed(1)}M</span>
                                </div>
                                <span class="mono font-black text-xl ${coin.change >= 0 ? 'text-[#39FF14]' : 'text-[#ff3366]'}">${coin.change >= 0 ? '+' : ''}${coin.change.toFixed(2)}%</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Active Trades
            const activeList = document.getElementById('activeTradesList');
            const pos = data.activePositions || [];
            document.getElementById('activeCount').innerText = pos.length;
            if (pos.length > 0) {
                activeList.innerHTML = pos.map(p => `
                    <div class="active-trade-card flex justify-between items-center border-l-2 border-[#39FF14]">
                        <div class="flex flex-col">
                            <span class="font-bold text-sm text-white">${p.symbol}</span>
                            <span class="text-[0.6rem] text-gray-500 mono">ENTRADA: $${p.buyPrice.toFixed(4)}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-[0.7rem] font-bold text-[#00ffc8] block mono">+0.40%</span>
                            <span class="text-[0.55rem] text-gray-600 mono uppercase tracking-tighter">Target: $${(p.buyPrice * 1.004).toFixed(4)}</span>
                        </div>
                    </div>
                `).join('');

            } else if (data.isLoopActive) {
                activeList.innerHTML = '<p class="text-gray-600 text-center text-[0.6rem] py-8 italic uppercase animate-pulse">Monitorando Ranks Pares...</p>';
            }

            // Logs
            if (data.logs && data.logs.length > 0) {
                const logEl = document.getElementById('logConsole');
                logEl.innerHTML = data.logs.slice(-50).map(l => {
                    let col = 'text-gray-500';
                    if (l.type === 'success' || l.type === 'buy') col = 'text-white border-l border-white/20 pl-2 bg-white/5';
                    if (l.type === 'sell') col = 'text-[#00ffc8] font-bold bg-[#00ffc8]/5 pl-2';
                    return `<div class="mb-1 py-1 ${col}">[${l.time}] ${l.msg}</div>`;
                }).join('');
                logEl.scrollTop = logEl.scrollHeight;
            }
        }

        async function validateAPI() {
            const k = document.getElementById('inputApiKey').value;
            const s = document.getElementById('inputApiSecret').value;
            const btn = document.getElementById('btnValidate');
            const btnS = document.getElementById('btnStart');

            if(!k || !s) return alert("Insira as chaves API!");

            btn.innerText = "⏳ Validando...";
            btn.className = "h-[42px] px-6 rounded-lg bg-yellow-500/20 border border-yellow-500/50 text-xs font-bold uppercase text-yellow-500 flex items-center gap-2";

            try {
                const res = await fetch('/check-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: k, apiSecret: s })
                });
                const data = await res.json();

                if (data.success) {
                    btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> CONECTADO`;
                    btn.className = "h-[42px] px-6 rounded-lg bg-green-500/20 border border-green-500/50 text-xs font-bold uppercase text-green-500 flex items-center gap-2";
                    btnS.classList.remove('opacity-50', 'pointer-events-none');
                    localStorage.setItem('alfa_k', k);
                    localStorage.setItem('alfa_s', s);
                    lucide.createIcons();
                } else {

                    btn.innerText = "❌ Erro nas Chaves";
                    btn.className = "h-[42px] px-6 rounded-lg bg-red-500/20 border border-red-500/50 text-xs font-bold uppercase text-red-500 flex items-center gap-2";
                }
            } catch(e) {
                btn.innerText = "❌ Falha Servidor";
            }
        }

        async function toggleMotor(start) {
            const k = localStorage.getItem('alfa_k');
            const s = localStorage.getItem('alfa_s');
            const n = localStorage.getItem('alfa_n') || 'Sniper_User';
            try {
                const res = await fetch(start ? '/start' : '/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: k, apiSecret: s, clientName: n, mode: 'ALFA_USDT' })
                });
                if(res.ok) isRunning = start;
            } catch(e) { alert("ERRO DE CONEXÃO!"); }
        }

    </script>
</body>
</html>
