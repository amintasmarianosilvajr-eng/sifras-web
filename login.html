<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifras Alfa — Acesso Exclusivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --cyber-blue: #ccff00;
            --text-main: #ffffff;
            --glass: rgba(18, 18, 18, 0.9);
            --neon-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 50%, #151515 0%, #050505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--glass);
            border: 1px solid rgba(204, 255, 0, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        .logo-box h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .logo-box span { color: var(--cyber-blue); }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--cyber-blue);
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 15px 15px 45px;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--cyber-blue);
            background: rgba(204, 255, 0, 0.05);
        }

        .btn-login {
            width: 100%;
            background: var(--cyber-blue);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: var(--neon-shadow);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--cyber-blue);
        }

        #errorMsg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 51, 102, 0.1);
            color: #ff3366;
            font-size: 0.85rem;
            display: none;
            border: 1px solid rgba(255, 51, 102, 0.2);
        }

        #successMsg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(204, 255, 0, 0.1);
            color: var(--cyber-blue);
            font-size: 0.85rem;
            display: none;
            border: 1px solid rgba(204, 255, 0, 0.2);
        }

        .footer-info {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #444;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-box">
        <h1>SIFRAS <span>ALFA</span></h1>
        <div class="subtitle">Acesso do Cliente</div>
    </div>

    <!-- Login Form -->
    <div id="loginStep">
        <div class="input-group">
            <label>E-mail (Apenas @gmail.com)</label>
            <div class="input-wrapper">
                <i class="ph ph-user"></i>
                <input type="email" id="email" placeholder="digite seu gmail..." required>
            </div>
        </div>

        <div class="input-group">
            <label>Senha de Acesso</label>
            <div class="input-wrapper">
                <i class="ph ph-lock"></i>
                <input type="password" id="password" placeholder="sua senha..." required>
            </div>
        </div>

        <button class="btn-login" id="btnLogin" onclick="doLogin()">ACESSAR PAINEL</button>
    </div>

    <div id="errorMsg"></div>
    <div id="successMsg"></div>

    <div class="footer-info">
        Monitoramento Sifras Invest © 2025
    </div>
</div>

<script>
    const GMAIL_REGEX = /^[a-z0-9._%+-]+@gmail\.com$/;

    async function doLogin() {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btnLogin');
        const err = document.getElementById('errorMsg');
        const succ = document.getElementById('successMsg');

        err.style.display = 'none';
        succ.style.display = 'none';

        if (!email || !password) {
            showError('Preencha todos os campos.');
            return;
        }

        // Validação Frontend do Gmail (Proteção Adicional)
        if (!GMAIL_REGEX.test(email)) {
            showError('Use um e-mail @gmail.com válido e sem símbolos extras.');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'AUTENTICANDO...';

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('sifras_token', data.token);
                localStorage.setItem('sifras_user', data.username);
                
                if (data.isAdmin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                showError(data.error || 'Erro ao entrar.');
            }
        } catch (e) {
            showError('Sem conexão com o servidor.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'ACESSAR PAINEL';
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.innerText = msg;
        err.style.display = 'block';
    }
</script>

</body>
</html>
